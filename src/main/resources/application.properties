spring.application.name=kafka-spring-cloud-stream
server.port=7070
#spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T1
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T1
spring.cloud.stream.bindings.kStreamFunction-in-0.destination=T1
spring.cloud.stream.bindings.kStreamFunction-out-0.destination=T2
spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;kStreamFunction
spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200
spring.cloud.stream.kafka.streams.binder.deserializationExceptionHandler=logAndContinue
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
